name: fuzz

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  replay:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-08-27 --profile minimal
          cargo_fuzz_version="$(tr -d '\r\n' < fuzz/cargo-fuzz.version)"
          cargo install --locked cargo-fuzz --version "${cargo_fuzz_version}"
      - name: Replay tracked corpora
        run: cargo xtask verify-fuzz-replay

  scheduled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-08-27 --profile minimal
          cargo_fuzz_version="$(tr -d '\r\n' < fuzz/cargo-fuzz.version)"
          cargo install --locked cargo-fuzz --version "${cargo_fuzz_version}"
      - name: Run scheduled fuzz campaigns
        run: |
          while IFS= read -r target; do
            cargo fuzz run "${target}" -- -max_total_time=300
          done < <(cargo fuzz list)
