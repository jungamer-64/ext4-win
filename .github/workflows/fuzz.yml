name: fuzz

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  replay:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and cargo-fuzz
        run: |
          rustup toolchain install
          cargo_fuzz_version="$(tr -d '\r\n' < fuzz/cargo-fuzz.version)"
          cargo install --locked cargo-fuzz --version "${cargo_fuzz_version}"
      - name: Replay tracked corpora
        run: cargo xtask verify-fuzz-replay
      - name: Retain failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-replay-evidence
          path: |
            fuzz/artifacts/**
            target/fuzz-corpus/**
          if-no-files-found: warn

  scheduled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and cargo-fuzz
        run: |
          rustup toolchain install
          cargo_fuzz_version="$(tr -d '\r\n' < fuzz/cargo-fuzz.version)"
          cargo install --locked cargo-fuzz --version "${cargo_fuzz_version}"
      - name: Run scheduled fuzz campaigns
        run: cargo xtask fuzz
      - name: Retain fuzz discoveries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-campaign-evidence
          path: |
            fuzz/artifacts/**
            target/fuzz-corpus/**
          if-no-files-found: warn
