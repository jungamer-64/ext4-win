name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: nightly-2026-08-23
  E2FSPROGS_RELEASE: 1.47.2

  # Keep cargo-wdk aligned with the exact windows-drivers-rs revision
  # used by this repository.
  WINDOWS_DRIVERS_RS_REV: 7d3000c6e60041c6ea1ab75abebe411e6482fca6

jobs:
  portable:
    name: portable (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >
          rustup toolchain install
          ${{ env.RUST_TOOLCHAIN }}
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Verify portable workspace
        run: cargo xtask verify-portable


  ext4-interop:
    name: ext4 interoperability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >
          rustup toolchain install
          ${{ env.RUST_TOOLCHAIN }}
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Install e2fsprogs oracle
        run: |
          sudo apt-get update
          sudo apt-get install --yes e2fsprogs

          actual_release="$(mke2fs -V 2>&1 | sed -n 's/^mke2fs \([0-9.]*\).*/\1/p')"
          if [ "$actual_release" != "${{ env.E2FSPROGS_RELEASE }}" ]; then
            echo "e2fsprogs release must be ${{ env.E2FSPROGS_RELEASE }}, found $actual_release" >&2
            exit 1
          fi

      - name: Verify journal interoperability
        run: cargo xtask verify-journal-interop

      - name: Build HTree interoperability verifier
        run: cargo build --locked --package xtask

      - name: Verify HTree interoperability
        run: sudo ./target/debug/xtask verify-htree-interop


  production-driver:
    name: hosted kernel-load smoke (WDK 28000)
    runs-on: windows-2025-vs2026
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          rustup toolchain install `
            "${{ env.RUST_TOOLCHAIN }}" `
            --profile minimal `
            --component rustfmt `
            --component clippy

          rustup toolchain list

      - name: Configure LLVM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $clang = Get-Command clang.exe -ErrorAction Stop
          $llvmBin = Split-Path $clang.Source

          Write-Host "clang: $($clang.Source)"
          Write-Host "LLVM bin: $llvmBin"

          "LIBCLANG_PATH=$llvmBin" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          clang --version

      - name: Install Windows SDK and WDK 28000
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing Windows SDK 28000..."

          winget install `
            --id Microsoft.WindowsSDK.10.0.28000 `
            --exact `
            --source winget `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          if ($LASTEXITCODE -ne 0) {
            throw "Windows SDK installation failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "Installing Windows WDK 28000..."

          winget install `
            --id Microsoft.WindowsWDK.10.0.28000 `
            --exact `
            --source winget `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          if ($LASTEXITCODE -ne 0) {
            throw "Windows WDK installation failed with exit code $LASTEXITCODE"
          }

          $kitsRoot = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Windows Kits\10"

          $libRoot = Join-Path $kitsRoot "Lib"

          if (-not (Test-Path $libRoot)) {
            throw "Windows Kits Lib directory was not found: $libRoot"
          }

          #
          # The WinGet package version is currently 28000.2526,
          # while the installed Windows Kits directory is
          # 10.0.28000.0.
          #
          $kitVersion = Get-ChildItem `
            -Path $libRoot `
            -Directory |
            Where-Object {
              $_.Name -like "10.0.28000.*"
            } |
            Sort-Object {
              [version]$_.Name
            } -Descending |
            Select-Object -First 1

          if (-not $kitVersion) {
            Write-Host ""
            Write-Host "Installed Windows Kit versions:"

            Get-ChildItem `
              -Path $libRoot `
              -Directory |
              Select-Object Name

            throw "WDK/SDK 28000 was installed but no 10.0.28000.x Kit directory was found"
          }

          $version = $kitVersion.Name

          Write-Host ""
          Write-Host "Windows Kits root: $kitsRoot"
          Write-Host "Selected WDK version: $version"

          #
          # wdk-build recognizes these environment variables.
          #
          # Explicitly setting them prevents the preinstalled
          # Windows Kit from being selected accidentally.
          #
          "WDKContentRoot=$kitsRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "Version_Number=$version" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "EXT4WIN_WDK_VERSION=$version" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          #
          # cargo-wdk can discover WDK tools itself,
          # but exposing both x64 and x86 directories
          # also makes the CI environment deterministic.
          #
          foreach ($arch in @("x64", "x86")) {
            $bin = Join-Path `
              $kitsRoot `
              "bin\$version\$arch"

            if (Test-Path $bin) {
              Write-Host "Adding to PATH: $bin"

              $bin |
                Out-File `
                  -FilePath $env:GITHUB_PATH `
                  -Encoding utf8 `
                  -Append
            }
          }

      - name: Verify WDK 28000 installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "WDKContentRoot = $env:WDKContentRoot"
          Write-Host "Version_Number = $env:Version_Number"

          $requiredPaths = @(
            "$env:WDKContentRoot\Include\$env:Version_Number\km",
            "$env:WDKContentRoot\Include\$env:Version_Number\shared",
            "$env:WDKContentRoot\Lib\$env:Version_Number\km\x64"
          )

          foreach ($path in $requiredPaths) {
            Write-Host "Checking: $path"

            if (-not (Test-Path $path)) {
              throw "Required WDK path does not exist: $path"
            }
          }

          Write-Host ""
          Write-Host "Available WDK tools:"

          Get-ChildItem `
            -Path "$env:WDKContentRoot\bin\$env:Version_Number" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @(
                "signtool.exe",
                "Inf2Cat.exe",
                "stampinf.exe",
                "infverif.exe"
              )
            } |
            Select-Object Name, FullName

      - name: Install cargo-wdk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          #
          # Use exactly the same windows-drivers-rs revision
          # as the repository's WDK crates.
          #
          cargo install cargo-wdk `
            --git https://github.com/microsoft/windows-drivers-rs `
            --rev "${{ env.WINDOWS_DRIVERS_RS_REV }}" `
            --locked

          cargo wdk --version

      - name: Set up Ubuntu 26.04 WSL oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $distro = "Ubuntu-26.04"
          $image = Join-Path `
            $env:RUNNER_TEMP `
            "ubuntu-26.04-wsl-amd64.wsl"
          $imageUri = `
            "https://releases.ubuntu.com/26.04/ubuntu-26.04-wsl-amd64.wsl"
          $checksums = Join-Path `
            $env:RUNNER_TEMP `
            "ubuntu-26.04-SHA256SUMS"
          $checksumsUri = `
            "https://releases.ubuntu.com/26.04/SHA256SUMS"

          Write-Host "=== WSL version ==="
          wsl.exe --version

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to query WSL version"
          }

          Write-Host ""
          Write-Host "=== WSL status ==="
          wsl.exe --status

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to query WSL status"
          }

          Write-Host ""
          Write-Host "=== Configure WSL2 as the default ==="
          wsl.exe --set-default-version 2

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to configure WSL2 as the default version"
          }

          Write-Host ""
          Write-Host "=== Download Ubuntu 26.04 WSL image ==="
          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-all-errors `
            --output $image `
            $imageUri

          if ($LASTEXITCODE -ne 0) {
            throw "Ubuntu 26.04 WSL image download failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path -LiteralPath $image)) {
            throw "Ubuntu 26.04 WSL image was not downloaded: $image"
          }

          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-all-errors `
            --output $checksums `
            $checksumsUri

          if ($LASTEXITCODE -ne 0) {
            throw "Ubuntu 26.04 checksum download failed with exit code $LASTEXITCODE"
          }

          $checksumLine = Get-Content -LiteralPath $checksums |
            Where-Object {
              $_ -match '\*ubuntu-26\.04-wsl-amd64\.wsl$'
            } |
            Select-Object -First 1

          if (-not $checksumLine) {
            throw "Ubuntu 26.04 WSL checksum was not found in SHA256SUMS"
          }

          $expectedHash = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash `
            -LiteralPath $image `
            -Algorithm SHA256).Hash.ToLowerInvariant()

          Write-Host "Downloaded image: $image"
          Get-Item -LiteralPath $image |
            Select-Object FullName, Length
          Write-Host "Expected SHA256: $expectedHash"
          Write-Host "Actual SHA256:   $actualHash"

          if ($actualHash -ne $expectedHash) {
            throw "Ubuntu 26.04 WSL image SHA256 mismatch"
          }

          Write-Host ""
          Write-Host "=== Install Ubuntu 26.04 ==="
          wsl.exe --install `
            --from-file $image `
            --name $distro `
            --version 2 `
            --no-launch

          if ($LASTEXITCODE -ne 0) {
            throw "Ubuntu 26.04 WSL installation failed with exit code $LASTEXITCODE"
          }

          wsl.exe --set-default $distro

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to set $distro as the default WSL distribution"
          }

          #
          # setup-wsl normally leaves these CI distributions using root.
          # Keep that contract so later direct wsl.exe calls and the xtask
          # oracle do not trigger Ubuntu's interactive first-run user setup.
          #
          wsl.exe --manage $distro --set-default-user root

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to configure root as the default $distro user"
          }

          Write-Host ""
          Write-Host "=== Installed WSL distributions ==="
          wsl.exe --list --verbose

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list WSL distributions"
          }

          Write-Host ""
          Write-Host "=== Ubuntu release ==="
          wsl.exe `
            --distribution $distro `
            --user root `
            --exec cat /etc/os-release

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to start $distro"
          }

          #
          # wsl.exe --exec does not guarantee the normal login-shell PATH.
          # e2fsprogs tools live below /usr/sbin on Ubuntu.
          #
          $linuxPath = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

          Write-Host ""
          Write-Host "=== Install e2fsprogs ==="
          wsl.exe `
            --distribution $distro `
            --user root `
            --exec /usr/bin/env `
            "PATH=$linuxPath" `
            "DEBIAN_FRONTEND=noninteractive" `
            /usr/bin/apt-get update

          if ($LASTEXITCODE -ne 0) {
            throw "apt-get update failed in $distro"
          }

          wsl.exe `
            --distribution $distro `
            --user root `
            --exec /usr/bin/env `
            "PATH=$linuxPath" `
            "DEBIAN_FRONTEND=noninteractive" `
            /usr/bin/apt-get install --yes e2fsprogs

          if ($LASTEXITCODE -ne 0) {
            throw "e2fsprogs installation failed in $distro"
          }

      - name: Verify runner contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Rust ==="
          rustc --version --verbose

          Write-Host ""
          Write-Host "=== Cargo ==="
          cargo --version

          Write-Host ""
          Write-Host "=== cargo-wdk ==="
          cargo wdk --version

          Write-Host ""
          Write-Host "=== LLVM ==="
          clang --version

          Write-Host ""
          Write-Host "=== WDK ==="
          Write-Host "WDKContentRoot=$env:WDKContentRoot"
          Write-Host "Version_Number=$env:Version_Number"

          Write-Host ""
          Write-Host "=== WSL ==="
          wsl.exe --status

          if ($LASTEXITCODE -ne 0) {
            throw "WSL status query failed"
          }

          Write-Host ""
          Write-Host "=== WSL distributions ==="
          wsl.exe --list --verbose

          if ($LASTEXITCODE -ne 0) {
            throw "WSL distribution query failed"
          }

          Write-Host ""
          Write-Host "=== Linux PATH ==="

          #
          # wsl.exe --exec does not guarantee the normal
          # interactive/login-shell PATH.
          #
          # e2fsprogs tools such as mke2fs/debugfs/e2fsck
          # live below /usr/sbin on Ubuntu.
          #
          $linuxPath = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          $e2fsprogsRelease = "${{ env.E2FSPROGS_RELEASE }}"

          wsl.exe `
            --distribution Ubuntu-26.04 `
            --exec /usr/bin/env `
            "PATH=$linuxPath" `
            /usr/bin/env

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to execute /usr/bin/env in WSL"
          }

          Write-Host ""
          Write-Host "=== e2fsprogs ==="

          wsl.exe `
            --distribution Ubuntu-26.04 `
            --exec /usr/bin/env `
            "PATH=$linuxPath" `
            mke2fs -V

          if ($LASTEXITCODE -ne 0) {
            throw "mke2fs is unavailable in WSL"
          }

          $mke2fsVersion = wsl.exe `
            --distribution Ubuntu-26.04 `
            --exec /usr/bin/env `
            "PATH=$linuxPath" `
            mke2fs -V 2>&1 | Out-String

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to query the WSL e2fsprogs release"
          }

          if ($mke2fsVersion -notmatch "(?m)^mke2fs $([regex]::Escape($e2fsprogsRelease))(?:\s|\()") {
            throw "e2fsprogs release must be $e2fsprogsRelease; mke2fs reported: $mke2fsVersion"
          }

          wsl.exe `
            --distribution Ubuntu-26.04 `
            --exec /usr/bin/env `
            "PATH=$linuxPath" `
            debugfs -V

          if ($LASTEXITCODE -ne 0) {
            throw "debugfs is unavailable in WSL"
          }

          wsl.exe `
            --distribution Ubuntu-26.04 `
            --exec /usr/bin/env `
            "PATH=$linuxPath" `
            e2fsck -V

          if ($LASTEXITCODE -ne 0) {
            throw "e2fsck is unavailable in WSL"
          }

          Write-Host ""
          Write-Host "=== e2fsprogs locations ==="

          foreach ($tool in @(
            "mke2fs",
            "debugfs",
            "e2fsck"
          )) {
            wsl.exe `
              --distribution Ubuntu-26.04 `
              --exec /usr/bin/env `
              "PATH=$linuxPath" `
              /usr/bin/which $tool

            if ($LASTEXITCODE -ne 0) {
              throw "$tool could not be resolved through the CI Linux PATH"
            }
          }

      #
      # cargo-wdk automatically generates WDRLocalTestCert
      # for test signing.
      #
      # --verify-signature intentionally requires the signing
      # certificate to already be trusted, so first perform a
      # normal signed build to generate/reuse the certificate,
      # then trust that certificate only inside this disposable
      # GitHub-hosted VM.
      #
      - name: Bootstrap cargo-wdk test certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Push-Location crates/ext4-driver

          try {
            cargo wdk build `
              --profile release `
              --locked

            if ($LASTEXITCODE -ne 0) {
              throw "Initial cargo-wdk build failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

          Write-Host ""
          Write-Host "Searching for WDRLocalTestCert.cer..."

          $certFiles = @(Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\target" `
            -Filter "WDRLocalTestCert.cer" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue)

          if ($certFiles.Count -eq 0) {
            throw "cargo-wdk did not produce WDRLocalTestCert.cer"
          }

          $certificates = @($certFiles | ForEach-Object {
            [PSCustomObject]@{
              File = $_
              Certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($_.FullName)
            }
          })
          $thumbprints = @($certificates.Certificate.Thumbprint | Sort-Object -Unique)

          if ($thumbprints.Count -ne 1) {
            throw "cargo-wdk produced multiple WDRLocalTestCert identities: $($thumbprints -join ', ')"
          }

          $certificateRecord = $certificates |
            Sort-Object { $_.File.LastWriteTime } -Descending |
            Select-Object -First 1
          $thumbprint = $thumbprints[0]

          Write-Host ""
          Write-Host "Generated certificate identity: $thumbprint"
          Write-Host "Selected certificate file: $($certificateRecord.File.FullName)"

          #
          # Root is required by cargo-wdk --verify-signature;
          # TrustedPublisher admits the test-signed package install.
          #
          # The GitHub-hosted Windows VM is ephemeral and
          # discarded after the job completes.
          #
          foreach ($store in @("Root", "TrustedPublisher")) {
            Import-Certificate `
              -FilePath $certificateRecord.File.FullName `
              -CertStoreLocation "Cert:\LocalMachine\$store" |
              Out-Null

            $trusted = Get-Item `
              -LiteralPath "Cert:\LocalMachine\$store\$thumbprint" `
              -ErrorAction Stop

            if ($trusted.Thumbprint -ne $thumbprint) {
              throw "LocalMachine\$store certificate identity mismatch"
            }

            Write-Host "Trusted LocalMachine\$store thumbprint: $($trusted.Thumbprint)"
          }

      - name: Check hosted driver environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cargo xtask check-hosted-driver-host

          if ($LASTEXITCODE -ne 0) {
            throw "Hosted driver preflight failed with exit code $LASTEXITCODE"
          }

      - name: Verify hosted driver load
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cargo xtask verify-hosted-driver-load

          if ($LASTEXITCODE -ne 0) {
            throw "Hosted driver-load verification failed with exit code $LASTEXITCODE"
          }

      - name: List verified production bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bundleRoot = "target\verified-production"

          if (-not (Test-Path $bundleRoot)) {
            throw "$bundleRoot was not created"
          }

          Write-Host "Verified production artifacts:"

          Get-ChildItem `
            -Path $bundleRoot `
            -Recurse `
            -File |
            Select-Object FullName, Length

      - name: Upload verified production bundle
        uses: actions/upload-artifact@v7
        with:
          name: ext4-win-verified-production-wdk-${{ env.EXT4WIN_WDK_VERSION }}
          path: target/verified-production/**
          if-no-files-found: error
          retention-days: 14
