[package]
name = "ext4-win-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
ext4-core = { path = "../crates/ext4-core" }
libfuzzer-sys = "0.4"

[[bin]]
name = "mount_image"
