[package]
name = "ext4win"
version = "0.1.0"
edition = "2024"
license.workspace = true

[package.metadata.wdk.driver-model]
driver-type = "WDM"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[build-dependencies]
cc.workspace = true
wdk-build.workspace = true

[dependencies]
ext4-core = { path = "../ext4-core" }
wdk-alloc.workspace = true
wdk-sys.workspace = true

[dev-dependencies]
# Host tests supply the driver boundary doubles; kernel import libraries must not resolve
# std's Nt/Rtl calls to ntoskrnl instead of the user-mode system libraries.
wdk-sys = { workspace = true, features = ["suppress-wdk-linking"] }

[features]
default = []
nightly = ["wdk-sys/nightly"]

[lints]
workspace = true
