[workspace]
members = [
    "crates/ext4-core",
    "crates/ext4-driver",
    "crates/ext4-security",
    "tools/production-reachability",
    "tools/xtask",
    "tools/diagnostics",
    "tools/ext4-fixture",
    "tools/windows-host",
    "tools/ext4ctl",
]
exclude = ["fuzz"]
default-members = [
    "crates/ext4-core",
    "crates/ext4-security",
    "tools/production-reachability",
    "tools/xtask",
    "tools/diagnostics",
    "tools/ext4-fixture",
    "tools/windows-host",
    "tools/ext4ctl",
]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cc = "1"
hkdf = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Diagnostics_Etw", "Win32_System_Time", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation", "Win32_Devices_DeviceAndDriverInstallation", "Wdk_Storage_FileSystem", "Wdk_Foundation"] }
wdk-build = { git = "https://github.com/jungamer-64/windows-drivers-rs", rev = "9d8a613800f7e4be066d035aeeea1daee6be55d3" }
wdk-sys = { git = "https://github.com/jungamer-64/windows-drivers-rs", rev = "9d8a613800f7e4be066d035aeeea1daee6be55d3" }
wdk-alloc = { git = "https://github.com/jungamer-64/windows-drivers-rs", rev = "9d8a613800f7e4be066d035aeeea1daee6be55d3" }

[profile.dev]
panic = "abort"

[profile.release]
lto = true
panic = "abort"

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unconditional_panic = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unknown_lints = "deny"
unsafe_op_in_unsafe_fn = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
private_doc_tests = "deny"
unescaped_backticks = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
panic = "deny"
panic_in_result_fn = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
missing_errors_doc = "forbid"
missing_panics_doc = "forbid"
missing_docs_in_private_items = "warn"
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
alloc_instead_of_core = "deny"
as_conversions = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
large_stack_frames = "deny"
large_stack_arrays = "deny"
bool_to_int_with_if = "deny"
undocumented_unsafe_blocks = "forbid"
multiple_unsafe_ops_per_block = "forbid"
